[package]
name = "twofcast"
version = "0.8.1"
description = "Two-person LAN videocasting for Ubuntu"
license = "MIT"
edition = "2024"

[[bin]]
name = "2fcast"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = "0.4.45"
gst = { version = "0.25.4", package = "gstreamer" }
gst_app = { version = "0.25.2", package = "gstreamer-app" }
gst_video = { version = "0.25.4", package = "gstreamer-video" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_6"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
twofcast-core = { version = "0.8.1", path = "../core" }
ureq = "3.5.1"
x11rb = "0.14.0"

[dev-dependencies]
tempfile = "3.27.0"
